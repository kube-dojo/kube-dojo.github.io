version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock, including the zizmor group).
  # requirements-machinery.lock is the lu-machinery consumer lock; it moves only
  # with a machinery release adoption, never through Dependabot.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      # Batch minor/patch bumps into one PR to cut review noise; majors stay separate.
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
    groups:
      # Batch minor/patch bumps into one PR to cut review noise; majors stay separate.
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (Astro / Starlight site)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "js"
    cooldown:
      default-days: 7
    groups:
      # Batch minor/patch bumps into one PR to cut review noise; majors stay separate.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
