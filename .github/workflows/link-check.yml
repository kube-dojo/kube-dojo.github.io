name: Static internal link check

# Runs on every PR (no `paths:` filter) so it can serve as a universal
# required status check. A path-filtered required check never reports on PRs
# that miss those paths, leaving the PR permanently BLOCKED waiting for a check
# that will never run — the same deadlock the CodeQL `Analyze` contexts caused
# for docs-only PRs (PR #1742 / the 2026-06-04 CI autopsy). Both steps are fast
# and dependency-free, so always-on is cheap.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-health:
    name: Site health link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # The SHA-256 of the x86_64 Linux archive makes an unverifiable
          # download fail instead of being installed unchecked (setup-uv skips
          # versions it has no checksum for). Change both together, in every
          # workflow that sets up uv.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          enable-cache: false

      - name: Check every locked artifact has a hash
        # uv lock --check and uv sync accept a uv.lock entry with no digest, and
        # an install verifies only the artifacts of its own platform. This
        # always-on check keeps every wheel and sdist on main hash-pinned, for
        # every platform's `uv sync --locked`.
        run: |
          python -I - <<'PY'
          import sys, tomllib
          with open("uv.lock", "rb") as f:
              lock = tomllib.load(f)
          missing = []
          for pkg in lock.get("package", []):
              # Registry and direct-URL artifacts carry digests; git, path and
              # virtual sources are pinned by commit or by this checkout.
              if not {"registry", "url"} & pkg.get("source", {}).keys():
                  continue
              artifacts = pkg.get("wheels", []) + ([pkg["sdist"]] if "sdist" in pkg else [])
              if not artifacts:
                  missing.append(f'{pkg["name"]} {pkg["version"]}: no artifacts')
              for art in artifacts:
                  if not str(art.get("hash", "")).startswith("sha256:"):
                      missing.append(f'{pkg["name"]} {pkg["version"]}: {art.get("url", "?")}')
          if missing:
              print("uv.lock artifacts without a sha256 digest:", *missing, sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print(f"uv.lock: every registry and URL artifact has a sha256 digest ({len(lock['package'])} packages)")
          PY

      - name: Install the locked runtime dependencies
        # check_site_health.py is stdlib-only, but the lab.url validator parses
        # frontmatter with a real YAML loader (robust against flow-style /
        # inline-comment edge cases — see codex R1 on PR #1790).
        # `uv sync` trusts index metadata for a lock entry without a digest, so
        # install from the exported lock with --require-hashes instead. Exporting
        # every group makes this always-on job refuse a uv.lock in which any
        # artifact lacks a hash. --locked refuses a stale lock; --no-build refuses
        # source builds.
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked-requirements.txt"
          uv venv --python "$(cat .python-version)" .venv
          uv pip sync --python .venv/bin/python --require-hashes --no-build \
            "$RUNNER_TEMP/locked-requirements.txt"

      - name: Run site health check
        run: .venv/bin/python scripts/check_site_health.py

      - name: Check lab URL convention
        run: .venv/bin/python scripts/ci/check_lab_urls.py

      - name: Check Mermaid flowchart labels
        # Mermaid renders client-side, so neither the astro build nor the
        # site-health check ever parses diagram syntax. An unquoted '(' in a
        # flowchart [..]/{..} node label aborts the whole diagram (it renders
        # as raw code in the browser). This stdlib-only lint closes that gap
        # deterministically. Author fix: `python scripts/ci/check_mermaid_labels.py --fix`.
        run: .venv/bin/python scripts/ci/check_mermaid_labels.py

      - name: Check route coherence
        # site-health checks that links RESOLVE; this checks the relationships
        # BETWEEN modules and their section route (a backward "Next Module" link
        # still resolves, so site-health passes it). Fails only on NEW backward /
        # broken Next-Module links beyond the committed baseline (ratchet) — the
        # existing inventory drains as the curriculum lane fixes it. Warnings
        # (skip / terminus-orphan / count-drift) report but do not fail. stdlib-only.
        # Refresh the baseline: python scripts/quality/check_route_coherence.py --update-baseline
        run: .venv/bin/python scripts/quality/check_route_coherence.py
