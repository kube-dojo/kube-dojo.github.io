name: Static internal link check

# Runs on every PR (no `paths:` filter) so it can serve as a universal
# required status check. A path-filtered required check never reports on PRs
# that miss those paths, leaving the PR permanently BLOCKED waiting for a check
# that will never run — the same deadlock the CodeQL `Analyze` contexts caused
# for docs-only PRs (PR #1742 / the 2026-06-04 CI autopsy). Both steps are fast
# and dependency-free, so always-on is cheap.
on:
  pull_request:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  site-health:
    name: Site health link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # check_site_health.py is stdlib-only, but the lab.url validator parses
        # frontmatter with a real YAML loader (robust against flow-style /
        # inline-comment edge cases — see codex R1 on PR #1790). PyYAML is
        # already a repo dependency (requirements.txt).
        run: python -m pip install --upgrade "pyyaml>=6.0.3"

      - name: Run site health check
        run: python scripts/check_site_health.py

      - name: Check lab URL convention
        run: python scripts/ci/check_lab_urls.py

      - name: Check Mermaid flowchart labels
        # Mermaid renders client-side, so neither the astro build nor the
        # site-health check ever parses diagram syntax. An unquoted '(' in a
        # flowchart [..]/{..} node label aborts the whole diagram (it renders
        # as raw code in the browser). This stdlib-only lint closes that gap
        # deterministically. Author fix: `python scripts/ci/check_mermaid_labels.py --fix`.
        run: python scripts/ci/check_mermaid_labels.py

      - name: Check route coherence
        # site-health checks that links RESOLVE; this checks the relationships
        # BETWEEN modules and their section route (a backward "Next Module" link
        # still resolves, so site-health passes it). Fails only on NEW backward /
        # broken Next-Module links beyond the committed baseline (ratchet) — the
        # existing inventory drains as the curriculum lane fixes it. Warnings
        # (skip / terminus-orphan / count-drift) report but do not fail. stdlib-only.
        # Refresh the baseline: python scripts/quality/check_route_coherence.py --update-baseline
        run: python scripts/quality/check_route_coherence.py
