name: Extensions in sync

# Verify that a clean checkout can materialize and verify the complete plan
# using the same pinned release as the consumer.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extensions-sync:
    name: Extensions in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # The SHA-256 of the x86_64 Linux archive makes an unverifiable
          # download fail instead of being installed unchecked (setup-uv skips
          # versions it has no checksum for). Change both together, in every
          # workflow that sets up uv.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          enable-cache: false

      - name: Install the locked machinery release
        # requirements-machinery.lock is the release's consumer lock (every entry
        # hash-pinned); uv pip --require-hashes refuses any missing or mismatched hash.
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv venv --python "$(cat .python-version)" .venv
          version=$(sed -nE 's/^lu-machinery==([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' requirements-machinery.lock)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one lu-machinery version and hash in requirements-machinery.lock" >&2
            exit 2
          fi
          wheelhouse=$(mktemp -d)
          wheel="lu_machinery-${version}-py3-none-any.whl"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$wheelhouse/$wheel" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/$wheel"
          uv pip install --python .venv/bin/python --require-hashes --no-build \
            --find-links "$wheelhouse" -r requirements-machinery.lock

      - name: Apply and verify the deployment
        run: |
          tracked=$(git ls-files -- .claude .codex .agents .deploy-state)
          if [[ -n "$tracked" ]]; then
            printf 'Commit deployment sources instead of generated outputs:\n%s\n' "$tracked" >&2
            exit 1
          fi
          .venv/bin/python -I -m lu_machinery.agent_deploy --project-root "$GITHUB_WORKSPACE"
          .venv/bin/python -I -m lu_machinery.agent_deploy --project-root "$GITHUB_WORKSPACE" --check
          .venv/bin/python scripts/security/check_agent_configs.py

      - name: Build installed headless Claude guard settings
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
        run: |
          .venv/bin/python -I - <<'PY'
          from lu_machinery.agent_runtime.adapters.claude import _headless_worker_settings

          for publish_guard in (False, True):
              _headless_worker_settings(publish_guard=publish_guard)
              print(f"Built headless Claude guard settings with publish_guard={publish_guard}")
          PY

      - name: Test deployed product hooks and configuration
        env:
          LEARN_UKRAINIAN_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          bash scripts/quality/test_deploy_check.sh
          .venv/bin/python -m pytest -q tests/test_hook_*.py tests/test_codex_project_config.py \
            tests/test_quality_hooks.py tests/test_quality_prompts.py
