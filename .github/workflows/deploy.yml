name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # .npmrc sets ignore-scripts=true (supply-chain hardening, #1812). `npm rebuild`
      # ALSO honours ignore-scripts, so it must be re-enabled for JUST these two
      # audited native deps — otherwise the rebuild is a no-op (review: codex #1813).
      - name: Rebuild allow-listed native deps
        run: npm rebuild esbuild sharp --ignore-scripts=false

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

  # CONTAIN boundary (#1812): `build` runs `npm ci` / `npm run build` with only
  # `contents: read` — NO OIDC or Pages token is available at install time. `deploy`
  # holds `id-token: write` + `pages: write` but runs NO npm commands. A compromised
  # dependency executing during `npm ci` cannot reach the OIDC/Pages credential.
  # Do NOT co-locate `npm install`/`npm ci` with the privileged deploy job.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
