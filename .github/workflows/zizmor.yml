name: GitHub Actions security scan

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # The SHA-256 of the x86_64 Linux archive makes an unverifiable
          # download fail instead of being installed unchecked (setup-uv skips
          # versions it has no checksum for). Change both together, in every
          # workflow that sets up uv.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          enable-cache: false

      - name: Install zizmor
        # The zizmor dependency group in pyproject.toml, exported from uv.lock and
        # installed with --require-hashes (uv sync would trust index metadata for
        # a lock entry without a digest).
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv export --locked --only-group zizmor --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/zizmor-requirements.txt"
          uv venv --python "$(cat .python-version)" .venv
          uv pip sync --python .venv/bin/python --require-hashes --no-build \
            "$RUNNER_TEMP/zizmor-requirements.txt"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/zizmor --persona=regular --strict-collection .github/
